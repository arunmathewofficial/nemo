image: debian:13-slim

.snippets:
  - &configure
    mkdir -p "${CMAKE_BUILD_DIR}"
    && pushd "${CMAKE_BUILD_DIR}"
    && (
      set -x;
      cmake
        -DCMAKE_VERBOSE_MAKEFILE="${CMAKE_VERBOSE_MAKEFILE}"
        -DCMAKE_EXPORT_COMPILE_COMMANDS="${CMAKE_EXPORT_COMPILE_COMMANDS}"
        -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}"
        -DCMAKE_CXX_COMPILER=${CXX}
        -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"
        ..
    )
    && popd
  - &build
    make -C "${CMAKE_BUILD_DIR}" -j "$(getconf _NPROCESSORS_ONLN)"

.cmake_variables:
  default_cmake_variables: &default_cmake_variables
    CMAKE_EXPORT_COMPILE_COMMANDS: "OFF"
    CMAKE_VERBOSE_MAKEFILE: "OFF"
    CMAKE_BUILD_DIR: "${CI_PROJECT_DIR}/build"
    CMAKE_BUILD_TYPE: Release 
    CXX: mpicxx
    CMAKE_PREFIX_PATH: "/usr/lib/x86_64-linux-gnu"


.default_job: &default_job
  tags:
    - docker
  variables:
    <<: *default_cmake_variables
  script:
    - *configure
    - *build

stages:
  - static analysis
  - build libraries
  - build executables
  - test

Format:
  <<: *default_job
  stage: static analysis
  variables:
    <<: *default_cmake_variables
    CXX: clang++
  before_script:
    - apt-get update -y
    - apt-get install --no-install-recommends -y
      git
      clang
      clang-format-18
  script:
    - ./tools/run_format.sh
      && git status
      && git diff-index --quiet HEAD
      || { echo "This commit contains unformatted files! Run tools/run_format.sh on the project to format them correctly."; false; }

Compile:
  <<: *default_job
  stage: build libraries
  variables:
    <<: *default_cmake_variables
  dependencies:
    - Format 
  before_script:
    - apt-get update -y
    - apt-get install --no-install-recommends -y
      git
      clang
      clang-format-18
      g++ 
      libsundials-dev
      openmpi-bin
      openmpi-common
      curl
      libcurl4-openssl-dev
      libhdf5-dev
      cmake
      libbz2-dev
      libspdlog-dev
      libfmt-dev
      libboost-dev
  artifacts:
    name: Serial 
    paths:

Test:
  <<: *default_job
  stage: test 
  variables:
    <<: *default_cmake_variables
    CXX: mpicxx
  script:
    - *configure
    - *build
    - make -C "${CMAKE_BUILD_DIR}/tests" test 
  dependencies:
    - Compile 
  artifacts:
    name: test 
    paths:


