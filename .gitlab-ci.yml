image: $CI_REGISTRY_IMAGE/nemo-ci:latest

.snippets:
  - &configure
    mkdir -p "${CMAKE_BUILD_DIR}"
    && pushd "${CMAKE_BUILD_DIR}"
    && (
      set -x;
      cmake
        -DCMAKE_VERBOSE_MAKEFILE="${CMAKE_VERBOSE_MAKEFILE}"
        -DCMAKE_EXPORT_COMPILE_COMMANDS="${CMAKE_EXPORT_COMPILE_COMMANDS}"
        -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}"
        -DCMAKE_CXX_COMPILER=${CXX}
        -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}"
        -DNEMO_OMP="${NEMO_OMP}"
        ..
    )
    && popd
  - &build
    make -C "${CMAKE_BUILD_DIR}" -j "$(getconf _NPROCESSORS_ONLN)"

.cmake_variables:
  default_cmake_variables: &default_cmake_variables
    CMAKE_EXPORT_COMPILE_COMMANDS: "OFF"
    CMAKE_VERBOSE_MAKEFILE: "OFF"
    CMAKE_BUILD_DIR: "${CI_PROJECT_DIR}/build"
    CMAKE_BUILD_TYPE: Release 
    CXX: mpicxx
    CMAKE_PREFIX_PATH: "/usr/lib/x86_64-linux-gnu"
    NEMO_OMP: "ON"

# Jobs only run on a runner that has all of a job's tags.  "zetaoph" is the
# podman runner on the zetaoph workstation; set RUNNER_TAG=docker (e.g. when
# running a pipeline by hand) to use the server's shared runners instead.
variables:
  RUNNER_TAG: "zetaoph"

.default_job: &default_job
  tags:
    - $RUNNER_TAG
  variables:
    <<: *default_cmake_variables
  script:
    - *configure
    - *build

stages:
  - static analysis
  - build
  - test

Format:
  <<: *default_job
  stage: static analysis
  variables:
    <<: *default_cmake_variables
    CXX: clang++
  before_script:
    - apt-get update -y
    - apt-get install --no-install-recommends -y
      git
      clang-format-18
      yapf3
  script:
    - ./tools/run_format.sh
      && git status
      && git diff-index --quiet HEAD
      || { echo "This commit contains unformatted files! Run tools/run_format.sh on the project to format them correctly."; false; }

Compile:
  <<: *default_job
  stage: build
  variables:
    <<: *default_cmake_variables
  before_script:
    - apt-get update -y
    - apt-get install --no-install-recommends -y
      git
      g++ 
      libsundials-dev
      openmpi-bin
      cmake
      libspdlog-dev
      libfmt-dev
      libboost-dev
      build-essential
  artifacts:
    name: build_libraries
    paths:
      - "${CMAKE_BUILD_DIR}"
    expire_in: 1 day

Test:
  <<: *default_job
  stage: test 
  variables:
    <<: *default_cmake_variables
    CXX: mpicxx
  needs:
    - job: Compile
      artifacts: true
  before_script:
    - apt-get update -y
    - apt-get install --no-install-recommends -y
      git
      g++ 
      libsundials-dev
      openmpi-bin
      cmake
      libspdlog-dev
      libfmt-dev
      libboost-dev
      build-essential
      python3
      python3-numpy
  script:
    - make -C "${CMAKE_BUILD_DIR}/tests" test
  artifacts:
    name: tests
    paths:
      - "${CMAKE_BUILD_DIR}/tests/"
    expire_in: 1 day

# Install NEMO, then build and run the example project against the installed
# copy, to check that find_package(NEMO) and NEMO::nemo work.
Install:
  <<: *default_job
  stage: test
  variables:
    <<: *default_cmake_variables
    NEMO_INSTALL_PREFIX: "${CI_PROJECT_DIR}/install"
    EXAMPLE_BUILD_DIR: "${CI_PROJECT_DIR}/build-example"
  needs:
    - job: Compile
      artifacts: true
  before_script:
    - apt-get update -y
    - apt-get install --no-install-recommends -y
      git
      g++
      libsundials-dev
      openmpi-bin
      cmake
      libspdlog-dev
      libfmt-dev
      libboost-dev
      build-essential
  script:
    - cmake --install "${CMAKE_BUILD_DIR}" --prefix "${NEMO_INSTALL_PREFIX}"
    - cmake -S examples/minimal -B "${EXAMPLE_BUILD_DIR}"
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_PREFIX_PATH="${NEMO_INSTALL_PREFIX}"
    - cmake --build "${EXAMPLE_BUILD_DIR}"
    - "${EXAMPLE_BUILD_DIR}/nemo-example"
    - cmake -S examples/sundials-logger -B "${EXAMPLE_BUILD_DIR}-sundials"
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_PREFIX_PATH="${NEMO_INSTALL_PREFIX}"
    - cmake --build "${EXAMPLE_BUILD_DIR}-sundials"
    - cd "${EXAMPLE_BUILD_DIR}-sundials" && ./nemo-sundials-logger
    - cd "${CI_PROJECT_DIR}"
    - cmake -S examples/wind-ionisation -B "${EXAMPLE_BUILD_DIR}-wind"
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_PREFIX_PATH="${NEMO_INSTALL_PREFIX}"
    - cmake --build "${EXAMPLE_BUILD_DIR}-wind"
    - "${EXAMPLE_BUILD_DIR}-wind/wind-ionisation examples/wind-ionisation/example_wc_wind.txt"



# Python package: build the sdist, then manylinux wheels from it for each
# CPython version, and test them (the full test suite for one version).
# Nothing is uploaded; the sdist and wheels are kept as artifacts.
# (Wheels for macOS and aarch64 are built by .github/workflows/wheels.yml.)
Python:
  stage: test
  image: quay.io/pypa/manylinux_2_28_x86_64
  tags:
    - $RUNNER_TAG
  needs: []
  script:
    - PY=/opt/python/cp313-cp313/bin/python
    - $PY -m pip install build
    - $PY -m build --sdist --outdir dist .
    - |
      set -e
      for py in /opt/python/cp31[0-5]-cp31[0-5]/bin/python; do
        echo "=== $py"
        $py -m pip wheel --no-deps --wheel-dir wheelhouse-raw dist/*.tar.gz
      done
      auditwheel repair --wheel-dir wheelhouse wheelhouse-raw/*.whl
      for py in /opt/python/cp31[0-5]-cp31[0-5]/bin/python; do
        tag=$(basename $(dirname $(dirname $py)))
        echo "=== test ${tag}"
        $py -m venv venv-${tag}
        venv-${tag}/bin/pip install pytest wheelhouse/*-${tag}-*.whl
        tests="-m 'not slow'"
        if [ "${tag}" = "cp313-cp313" ]; then tests=""; fi
        eval venv-${tag}/bin/pytest python/tests -p no:cacheprovider ${tests}
      done
  artifacts:
    name: python-packages
    paths:
      - dist/
      - wheelhouse/
    expire_in: 1 week
