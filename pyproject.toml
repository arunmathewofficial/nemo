[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "nemo-plasma"
dynamic = ["version"]
description = "Python interface to NEMO, a non-equilibrium multi-ion solver for the ionisation and thermal state of astrophysical plasmas"
readme = "python/README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Arun Mathew" },
  { name = "Jonathan Mackey" },
  { name = "Maggie Celeste Goulden" },
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/jmackey-astro/nemo"
Source = "https://gitlab.git.nrw/jmackey1/nemo"
Paper = "https://doi.org/10.1051/0004-6361/202452373"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
build-dir = "build-python/{wheel_tag}"
wheel.packages = ["python/nemo_plasma"]
# The C++ sources, CMake files and Python package; not tests, examples or
# local build directories.
sdist.exclude = ["*"]
sdist.include = [
  "/CMakeLists.txt", "/LICENSE", "/README.md", "/pyproject.toml",
  "/cmake/**", "/source/**", "/python/**",
]

[tool.scikit-build.cmake.define]
NEMO_PYTHON = "ON"
CMAKE_BUILD_TYPE = "Release"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''project\(\s*NEMO\s+VERSION\s+(?P<value>[0-9.]+)'''

[tool.cibuildwheel]
# CPython 3.10 to 3.15 (not the free-threaded builds); manylinux_2_28 wheels
# for x86_64 and aarch64, and macOS wheels (set the architectures with
# CIBW_ARCHS or by the machine that builds them).
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-macosx_universal2 *-musllinux_* *-manylinux_i686 *-manylinux_ppc64le *-manylinux_s390x *-manylinux_armv7l *-manylinux_riscv64"
build-verbosity = 1
test-requires = ["pytest"]
test-command = "pytest {project}/python/tests -m 'not slow' -p no:cacheprovider"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
testpaths = ["python/tests"]
markers = ["slow: takes more than a few seconds (deselect with -m 'not slow')"]
